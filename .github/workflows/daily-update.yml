name: Daily dashboard update

on:
  schedule:
    # 07:30 Europe/Zurich = 06:30 UTC during CET (winter)
    - cron: '30 6 * 11-12,1-3 *'
    # 07:30 Europe/Zurich = 05:30 UTC during CEST (summer)
    - cron: '30 5 * 4-10 *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Daily dashboard refresh"
          git push
